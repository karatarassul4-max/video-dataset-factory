[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dataset-factory"
version = "0.1.0"
description = "Research-oriented video dataset pipeline for text-to-video model experiments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karatar Assul"}]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
ray = ["ray>=2.9"]
dashboard = ["streamlit>=1.36", "pandas>=2.0"]
captioning = [
    "pillow>=10.0",
    "torch>=2.1",
    "transformers>=4.44",
]
scene = ["scenedetect>=0.6.4"]

[project.scripts]
vdf = "video_dataset_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
