pipeline:
  sample_frames: 8
  output_manifest: outputs/manifest.jsonl

quality:
  min_duration_sec: 1.0
  max_duration_sec: 20.0
  min_width: 256
  min_height: 256
  min_blur_score: 40.0
  min_brightness: 20.0
  max_brightness: 235.0
  max_ocr_text_area_ratio: 0.08
  min_motion_score: 0.2
  max_motion_score: 50.0
  min_aesthetic_score: 5.0

scene_split:
  detector: content
  threshold: 27.0
  min_scene_len_frames: 15
  output_dir: data/clips
  output_fps: 24
  output_width: 512
  output_height: 512
  crf: 18
  preset: medium

captioning:
  provider: heuristic
  model_name: null
  model_family: qwen2-vl
  device: auto
  max_keyframes: 4
  max_new_tokens: 160
  cache_path: outputs/caption_cache.json
  prompt_style: dense_video

ocr:
  provider: easyocr
  languages: [en]
  gpu: false
  max_frames: 4
  min_confidence: 0.35

aesthetic:
  provider: laion
  model_name: openai/clip-vit-base-patch32
  head_path: null
  head_url: https://github.com/LAION-AI/aesthetic-predictor/raw/main/sa_0_4_vit_b_32_linear.pth
  device: auto
  max_frames: 4

ray:
  enabled: false
  num_cpus: null
